$kind: http-request
name: Attack 2 - Invalid JWT
url: "{{baseUrl}}/api/movies/1"
method: DELETE
headers:
  Authorization: Bearer {{invalidToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Invalid token is rejected", function () {
          pm.response.to.have.status(401);
          pm.expect(pm.response.json().message).to.eql("Invalid or expired token");
      });
    language: text/javascript
order: 7000
