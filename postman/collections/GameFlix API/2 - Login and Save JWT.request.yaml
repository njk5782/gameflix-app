$kind: http-request
url: "{{baseUrl}}/api/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "{{username}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login succeeds", function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().message).to.eql("Login successful");
      });
      pm.collectionVariables.set("jwtToken", pm.response.json().token);
    language: text/javascript
order: 2000
